<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veltrix WhatsApp</title>
<link rel="stylesheet" href="./login.css">

<div class="aurora" aria-hidden="true">
  <span class="blob blob--green"></span>
  <span class="blob blob--deep"></span>
  <span class="blob blob--gold"></span>
  <span class="grain"></span>
</div>

<main class="stage">
  <section class="card" role="region" aria-label="Đăng nhập Veltrix WhatsApp">
    <div class="card__glow" aria-hidden="true"></div>

    <header class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Veltrix">
          <defs>
            <linearGradient id="markFill" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1cae76"/>
              <stop offset="1" stop-color="#0b6b4c"/>
            </linearGradient>
            <linearGradient id="markEdge" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e6cf8f"/>
              <stop offset="1" stop-color="#b8944a"/>
            </linearGradient>
          </defs>
          <rect x="2.5" y="2.5" width="43" height="43" rx="13" fill="url(#markFill)"/>
          <rect x="2.5" y="2.5" width="43" height="43" rx="13" fill="none" stroke="url(#markEdge)" stroke-width="1.4"/>
          <!-- chat bubble tail -->
          <path d="M14 33.5 Q10.5 34 9 36.5 Q11.8 35.9 13.4 34.6 Z" fill="#eafff5" opacity="0.92"/>
          <!-- VH monogram -->
          <path d="M14.6 15.2 L19.4 30.6 L21.8 30.6 L24.5 22 L27.2 30.6 L29.6 30.6 L34.4 15.2 L31.5 15.2 L28.2 26.4 L25.6 18.2 L23.4 18.2 L20.8 26.4 L17.5 15.2 Z" fill="#eafff5"/>
          <circle cx="24" cy="24" r="1.6" fill="#d4b35e"/>
        </svg>
      </div>
      <div class="brand__text">
        <p class="brand__name">VELTRIX HOLDING</p>
        <p class="brand__tag">WhatsApp nội bộ</p>
      </div>
      <span class="pill">Nội bộ</span>
    </header>

    <div class="intro">
      <h1 class="title">Đăng nhập</h1>
      <p class="subtitle">Truy cập bảng điều khiển tin nhắn của đội ngũ Veltrix.</p>
    </div>

    <form id="loginForm" class="form" novalidate>
      <div class="field">
        <label class="label" for="usernameInput">Tài khoản</label>
        <div class="control">
          <svg class="control__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="8.2" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M5.5 19c1.3-3.4 4-5 6.5-5s5.2 1.6 6.5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input id="usernameInput" name="username" type="text" value="admin"
                 autocomplete="username" spellcheck="false" required
                 placeholder="Tên tài khoản">
        </div>
      </div>

      <div class="field">
        <label class="label" for="passwordInput">Mật khẩu</label>
        <div class="control">
          <svg class="control__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="5" y="10.5" width="14" height="9" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8.2 10.5V8.2a3.8 3.8 0 0 1 7.6 0v2.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input id="passwordInput" type="password" autocomplete="current-password"
                 required autofocus placeholder="Nhập mật khẩu">
          <button id="togglePasswordButton" type="button" class="toggle" aria-label="Hiện mật khẩu">Hiện</button>
        </div>
      </div>

      <p id="loginMessage" role="status" aria-live="polite" class="message"></p>

      <button id="submitButton" type="submit" class="submit">
        <span class="submit__label">Vào chat</span>
        <svg class="submit__arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>

    <footer class="foot">
      <span class="foot__dot" aria-hidden="true"></span>
      Kết nối được mã hoá đầu cuối
    </footer>
  </section>

  <p class="colophon">© Veltrix Holding · Hệ thống nội bộ</p>
</main>

<script src="./login.js"></script>
