# Manual: free space on vgcbrowser.com/dl by deleting the files of the given old versions
# (and stale upload leftovers). Never touches latest*.yml or any version not listed.
name: Clean old downloads (manual)
on:
  workflow_dispatch:
    inputs:
      versions:
        description: Space-separated versions to delete, e.g. "2.1.84 2.1.86"
        required: false
        default: ""
      min_version:
        description: Force every app older than this to update (writes dl/min-version.json). Empty = unchanged.
        required: false
        default: ""
      purge_archive:
        description: Also delete old installers in domains/vgcbrowser.com/dl-archive
        type: boolean
        default: false
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old version files
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          VERSIONS: ${{ inputs.versions }}
          PURGE: ${{ inputs.purge_archive }}
          MINV: ${{ inputs.min_version }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$MINV" ]; then
            echo "$MINV" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad min_version"; exit 1; }
            curl -fsS "https://vgcbrowser.com/dl/latest.yml?t=$(date +%s)" | grep -q "^version: $MINV$" \
              || { echo "::error::latest.yml chưa phải $MINV — không khoá máy khi chưa có bản để cập nhật"; exit 1; }
            curl -fsS "https://vgcbrowser.com/dl/latest-mac.yml?t=$(date +%s)" | grep -q "^version: $MINV$" \
              || { echo "::error::latest-mac.yml chưa phải $MINV"; exit 1; }
          fi
          for v in $VERSIONS; do
            echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version $v"; exit 1; }
          done
          ssh -p 65002 -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            u469659181@195.179.238.65 "VERSIONS='$VERSIONS' PURGE='$PURGE' MINV='$MINV' bash -s" <<'REMOTE'
          set -u
          cd domains/vgcbrowser.com/public_html/dl
          echo "== before"; ls -la; du -sh . ; df -h ~ 2>/dev/null || true; quota -s 2>/dev/null || true
          find . -maxdepth 1 -name '.*.part-*' -print -delete
          for v in $VERSIONS; do
            for f in *"-$v-"* *"-$v."*; do [ -f "$f" ] && echo "delete $f" && rm -f -- "$f"; done
          done
          if [ "$PURGE" = true ]; then
            echo "== purge dl-archive"
            find ~/domains/vgcbrowser.com/dl-archive -maxdepth 1 -type f -name 'VGC-Browser-*' -print -delete
            du -sh ~/domains/vgcbrowser.com/dl-archive
          fi
          if [ -n "$MINV" ]; then
            printf '{\n  "minVersion": "%s",\n  "downloadUrl": "https://vgcbrowser.com/"\n}\n' "$MINV" > .min-version.tmp && mv -f .min-version.tmp min-version.json
            echo "== min-version.json"; cat min-version.json
          fi
          echo "== after"; du -sh .
          echo "== write test"
          head -c 1024 /dev/zero > .wtest-small && echo "small write OK" || echo "small write FAILED"
          head -c 52428800 /dev/zero > .wtest-big && echo "50MB write OK" || echo "50MB write FAILED"
          head -c 209715200 /dev/zero > .wtest-big2 && echo "200MB write OK" || echo "200MB write FAILED"
          ls -la .wtest-* ; rm -f .wtest-*
          echo "== account usage"; cd ~
          du -sh . 2>/dev/null
          echo "-- top level"; du -sh -- * .[!.]* 2>/dev/null | sort -h | tail -12
          echo "-- vgcbrowser.com"; du -h -d 2 domains/vgcbrowser.com 2>/dev/null | sort -h | tail -15
          echo "-- biggest files (>200MB)"; find . -xdev -type f -size +200M -printf '%s\t%TY-%Tm-%Td\t%p\n' 2>/dev/null | sort -n | tail -40 | awk -F'\t' '{printf "%7.0fM  %s  %s\n", $1/1048576, $2, $3}'
          REMOTE
