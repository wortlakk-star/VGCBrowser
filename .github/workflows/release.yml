name: Build & publish (auto-update)

# A manual run builds BOTH the Windows and macOS apps and uploads them +
# their update manifests (latest.yml / latest-mac.yml) to vgcbrowser.com/dl, so all
# installed apps auto-update on next launch. To actually ship an update, bump the
# "version" in package.json in the commit you push (installs only update to a
# higher version). Run manually anytime via the "Run workflow" button.
#
# Uploads via SSH KEY (repo secret HOSTINGER_SSH_KEY = the id_ed25519 private key) —
# the SAME key build-mac.yml uses. The old password secret (DEPLOY_SSH_PASSWORD) never
# authenticated for the Windows publish, so the Windows auto-update feed froze while
# macOS (key-based) kept advancing. Use the key for both.
# Each runner uploads its own output directly so GitHub artifact-storage quota cannot
# block a release after the installers have already built successfully.

# Triggered MANUALLY (button) or by a version tag — NOT on every push to main,
# because the repo's git auto-sync commits to main every ~10-20 min and we don't
# want to rebuild on each of those. To release: bump "version" in package.json,
# commit, then either click "Run workflow" or push a tag:
#   git tag v0.1.34 && git push origin v0.1.34
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest
    env:
      # Keep URL and hash together: a hash for a newer engine than the URL means every
      # fetch attempt downloads the old zip and fails its SHA-256 check (2.1.77's first runs).
      VGC_ENGINE_URL: https://vgcbrowser.com/dl/vgc-core-158.zip
      VGC_ENGINE_SHA256: 51bf06becf542b9d4ed251026d660e19b35905732e407f8f8229b891767f7d26
      VGC_ALLOW_UNSIGNED_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pre-fetch the ~357MB engine with retries — a flaky download from the host was
      # the most likely cause of build-win failing on every release after 0.1.58
      # (Mac, which doesn't fetch the engine, kept publishing fine). npm run dist's
      # own fetch-engine then skips because engine/chromium/chrome.exe already exists.
      - name: Fetch engine (with retry)
        shell: bash
        run: |
          # Every line of this step is also kept in fetch-engine.log, which the next step
          # copies to the host when the fetch fails: GitHub job logs are not readable
          # without repo auth, and a run that fails 8 times in 20 minutes with no visible
          # reason (2.1.77) is not diagnosable otherwise. The curl probe answers the first
          # question by itself: do the bytes that reach the runner match the pinned hash?
          set -o pipefail
          {
            node -v
            echo "== HEAD $VGC_ENGINE_URL"
            curl -sSI --max-time 30 "$VGC_ENGINE_URL" | head -8 || true
            echo "== full download probe"
            curl -sS --max-time 900 -o probe.zip \
              -w 'code=%{http_code} size=%{size_download} speed=%{speed_download} B/s ip=%{remote_ip}\n' \
              "$VGC_ENGINE_URL" || true
            echo "sha256 expected $VGC_ENGINE_SHA256"
            echo "sha256 received $(sha256sum probe.zip | cut -d' ' -f1)"
            rm -f probe.zip
            for i in 1 2 3; do
              node scripts/fetch-engine.mjs && break || { echo "fetch attempt $i failed; retrying in $((i*30))s"; sleep $((i*30)); }
            done
            test -f engine/chromium/chrome.exe || { echo "engine still missing after retries"; exit 1; }
          } 2>&1 | tee fetch-engine.log
      - name: Keep the fetch log on vgcbrowser.com when the fetch failed
        if: failure()
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          { [ -n "$SSH_KEY" ] && [ -f fetch-engine.log ]; } || exit 0
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Outside public_html on purpose: diagnostics, not a download.
          scp -P 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new fetch-engine.log \
            u469659181@212.85.28.201:domains/vgcbrowser.com/ci-fetch-${{ github.run_id }}.log
      - run: npm run dist # electron-vite build && electron-builder --win (nsis one-file)
      - name: Verify unsigned Windows installer
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem release -Filter 'VGC-Browser-Setup-*.exe')
          if ($installer.Count -ne 1) { throw "Expected one Windows installer, found $($installer.Count)" }
          node scripts/pe-signature.cjs $installer[0].FullName
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if (-not (Select-String -LiteralPath release/latest.yml -Pattern "^version: $([regex]::Escape($version))$" -Quiet)) {
            throw 'latest.yml version does not match package.json'
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $installer[0].FullName
      - name: Collect Windows artifacts
        shell: bash
        run: |
          mkdir -p out-dl
          # Target is "nsis" (one-file installer) → output is in release/ directly,
          # NOT release/nsis-web/ and there is no .7z. (This path mismatch is what
          # silently failed every Windows release since 0.1.46.)
          cp release/*.exe release/latest.yml out-dl/
          cp release/*.blockmap out-dl/ 2>/dev/null || true
          ls -la out-dl/
      - name: Publish Windows artifacts
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Missing secret HOSTINGER_SSH_KEY."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Binaries first, each verified by SHA-256 on the server, latest.yml last.
          bash scripts/publish-dl.sh out-dl/latest.yml out-dl/*.exe out-dl/*.blockmap

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac # electron-vite build && electron-builder --mac (dmg + zip)
      - name: Collect macOS artifacts
        run: |
          mkdir -p out-dl
          cp release/latest-mac.yml release/*-mac-*.zip release/*-mac-*.dmg out-dl/
      - name: Publish macOS artifacts and landing page
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Missing secret HOSTINGER_SSH_KEY."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Binaries first, each verified by SHA-256 on the server, latest-mac.yml after
          # them and the landing page last. A cut upload (the host ran out of disk quota
          # during 2.1.77's first run and left a truncated zip behind a manifest that
          # already advertised it) fails here instead of shipping a broken update.
          VGC_SITE_INDEX=web/index.html bash scripts/publish-dl.sh \
            out-dl/latest-mac.yml out-dl/*-mac-*.zip out-dl/*-mac-*.dmg
