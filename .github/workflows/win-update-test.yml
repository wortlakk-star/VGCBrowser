name: Thử cập nhật bản Windows (tay)

# Cài bản cũ trên máy Windows của CI, mở app, để màn hình bắt buộc cập nhật tự tải bản mới nhất
# trên vgcbrowser.com/dl rồi bấm "Cập nhật ngay" — kiểm tra máy lên đúng bản mới và app tự mở lại.
# Chỉ chạy tay; không build, không đưa gì lên web.
on:
  workflow_dispatch:
    inputs:
      from_version:
        description: 'Bản cũ cài trước (vd 2.1.90)'
        required: true
        default: '2.1.90'
      build_from_source:
        description: 'Build bản cũ từ mã nguồn của nhánh này (đánh số from_version) thay vì tải trên web'
        type: boolean
        default: false

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VGC_ENGINE_URL: https://vgcbrowser.com/dl/vgc-core-159.zip
      VGC_ENGINE_SHA256: 1ccb4569f06ee62308344f7d4f101e67993b42027074b3549bc8ab19bd294112
      VGC_ALLOW_UNSIGNED_BUILD: '1'
      VGC_TARGET: ${{ vars.VGC_TARGET || 'xeon' }}
      VGC_APP_KEY: ${{ secrets.VGC_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build bản cũ từ mã nguồn (không đưa lên web)
        if: ${{ inputs.build_from_source }}
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          node -e "const f='package.json',p=require('./'+f);p.version='${{ inputs.from_version }}';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          for i in 1 2 3; do node scripts/fetch-engine.mjs && break || sleep $((i*30)); done
          node scripts/brand-engine.mjs && node scripts/release-notes.mjs
          npx electron-vite build
          npx electron-builder --win --publish never
          cp "release/VGC-Browser-Setup-${{ inputs.from_version }}.exe" old.exe
          git checkout -- package.json
      - name: Cài bản cũ
        shell: pwsh
        run: |
          $v = '${{ inputs.from_version }}'
          if (-not (Test-Path old.exe)) { Invoke-WebRequest "https://vgcbrowser.com/dl/VGC-Browser-Setup-$v.exe" -OutFile old.exe }
          $t = Get-Date; Start-Process -Wait .\old.exe -ArgumentList '/S'
          "cài bản cũ mất $([int]((Get-Date)-$t).TotalSeconds)s"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'VGC Browser.exe' | Select-Object -First 1
          "đã cài: $($exe.FullName) — phiên bản $($exe.VersionInfo.ProductVersion)"
          "EXE=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV
      - name: Mở app, chờ tự tải bản mới, bấm Cập nhật ngay
        shell: pwsh
        run: |
          npm i --no-save --no-audit --no-fund ws@8 | Out-Null
          Start-Process -FilePath $env:EXE -ArgumentList '--remote-debugging-port=9222'
          node .github/scripts/win-update-test.cjs
          if ($LASTEXITCODE -ne 0) { throw "lái app lỗi ($LASTEXITCODE)" }
          "BAM=$(Get-Date -Format o)" | Out-File -Append $env:GITHUB_ENV
      - name: Chờ cài xong và app tự mở lại
        shell: pwsh
        run: |
          $want = (Invoke-WebRequest https://vgcbrowser.com/dl/latest.yml).Content -split "`n" | Where-Object { $_ -match '^version:' } | ForEach-Object { ($_ -split ':')[1].Trim() }
          "bản mới nhất trên web: $want"
          $t = [datetime]$env:BAM
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 5
            $ver = (Get-Item $env:EXE -ErrorAction SilentlyContinue).VersionInfo.ProductVersion
            $run = @(Get-Process 'VGC Browser' -ErrorAction SilentlyContinue).Count
            $inst = (Get-Process | Where-Object { $_.ProcessName -like 'VGC-Browser-Setup*' -or $_.ProcessName -like '*installer*' -or $_.ProcessName -like '*Setup*' } | ForEach-Object { $_.ProcessName }) -join ','
            "$([int]((Get-Date)-$t).TotalSeconds)s sau khi bấm: phiên bản=$ver app_chạy=$run bộ_cài=[$inst]"
            if ("$ver".StartsWith($want) -and $run -gt 0) { "ĐẠT: đã lên $want và app tự mở lại"; $ok = $true; break }
          }
          if (-not $ok) { throw "KHÔNG ĐẠT: không lên $want trong 5 phút" }
      - name: Bản mới mở lên có còn đòi cập nhật không
        shell: pwsh
        run: |
          Get-Process 'VGC Browser' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          Start-Process -FilePath $env:EXE -ArgumentList '--remote-debugging-port=9222'
          node .github/scripts/win-after-update.cjs
          for ($i = 0; $i -lt 24; $i++) {
            Start-Sleep 10
            $inst = (Get-Process | Where-Object { $_.ProcessName -like '*Setup*' -or $_.ProcessName -like '*installer*' } | ForEach-Object { "$($_.ProcessName) $($_.Path)" }) -join '; '
            "$(($i+1)*10)s: phiên bản=$((Get-Item $env:EXE).VersionInfo.ProductVersion) bộ_cài=[$inst]"
          }
          node .github/scripts/win-after-update.cjs
          "--- thư mục bộ cập nhật:"
          Get-ChildItem "$env:LOCALAPPDATA\vgc-browser-updater" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize | Out-String -Width 300
